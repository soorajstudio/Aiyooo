<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIYOOO Startup | Next-Gen Websites, Portfolios, Resumes & AI Media</title>

    <!-- Webflow Base Stylesheet -->
    <link
      href="https://cdn.prod.website-files.com/6848603da8e6ac95794b7498/css/gethyped-preview.webflow.shared.6c2a2e206.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Ayioo Studio Scoped Stylesheet -->
    <link href="/assets/css/two26-scoped.css" rel="stylesheet" type="text/css" />

    <style>
      /* Ayioo Part Integration Styles */
      .ayioo-part {
        --brand-secondary: #f8eee8;
        --brand-black: #000;
        --brand-white: #fdf8f5;
        --font-secondary: Neuemontreal, Arial, sans-serif;
        --brand-primary: #ff5400;
        --font-primary: Mdnichrometest, Arial, sans-serif;
        --brand-accent: #f9e2e1;
        --font-primary-dark: "Mdnichrometest Dark", Arial, sans-serif;
        --brand-purple: #000;
        background-color: var(--brand-secondary);
        color: var(--brand-black);
        position: relative;
        width: 100%;
        overflow-x: hidden;
        clear: both;
      }

      .ayioo-part .page {
        height: auto !important;
        overflow: visible !important;
        position: relative !important;
        width: 100% !important;
        background-color: transparent !important;
      }

      .ayioo-part .loader {
        display: none !important;
      }

      /* Ensure the studio header is prominently visible at the top of the section */
      .ayioo-part .header {
        position: relative !important;
        width: 100% !important;
        background-color: #fae3e2 !important;
        border-bottom: 1px solid rgba(255, 84, 0, 0.15) !important;
        z-index: 100 !important;
        top: 0 !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04) !important;
      }

      .ayioo-part .navbar-wrap {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        width: 100% !important;
        padding: 1.25rem 2.5rem !important;
        box-sizing: border-box !important;
        background-color: #fae3e2 !important;
      }

      .ayioo-part .navbar-links {
        display: flex !important;
        align-items: center !important;
        gap: 0.75rem !important;
      }

      .ayioo-part .navbar-logo {
        display: flex !important;
        align-items: center !important;
        text-decoration: none !important;
      }

      /* Give generous headroom to the hero title so it is never clipped */
      .ayioo-part .section-hero-wrapper {
        padding-top: 5rem !important;
        overflow: visible !important;
      }

      .ayioo-part .hero-text {
        margin-top: 1rem !important;
        margin-bottom: 3.5rem !important;
        position: relative !important;
      }

      .ayioo-part .heading {
        font-size: clamp(3.2rem, 7.5vw, 7.5rem) !important;
        line-height: 0.9 !important;
      }

      .ayioo-part .hero-line-mask {
        display: block !important;
        overflow: hidden !important;
        padding: 0.12em 0 !important;
      }

      .two26-nav-toggle-btn {
        width: 2.5em !important;
        height: 2.5em !important;
        min-width: 2.5em !important;
        min-height: 2.5em !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border: 2px solid #ff5400 !important;
        border-radius: 0.25em !important;
        background-color: #f9e2e1 !important;
        box-sizing: border-box !important;
        cursor: pointer !important;
        padding: 0.35em !important;
        position: relative !important;
        user-select: none !important;
        -webkit-tap-highlight-color: transparent !important;
      }

      .two26-toggle-svg {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        overflow: visible !important;
        display: block !important;
        transform-origin: center center !important;
        will-change: transform;
        pointer-events: none !important;
      }

      .two26-toggle-svg path {
        will-change: stroke-dashoffset, stroke-dasharray, stroke-width;
      }

      /* Native scrollbar smoothing */
      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0b0b0b;
        color: #fff;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- GSAP Plugins -->
    <script src="/assets/js/DrawSVGPlugin.min.js"></script>
    <script src="/assets/js/MotionPathPlugin.min.js"></script>
    <script src="/assets/js/CustomEase.min.js"></script>
    <script src="/assets/js/CustomBounce.min.js"></script>

    <!-- React Application Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
